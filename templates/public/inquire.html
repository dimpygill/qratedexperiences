{% extends "public/base.html" %}
{% block title %}Request a Quote — Q-Rated Experiences{% endblock %}
{% block content %}

<section class="section-tight">
  <div class="container" style="max-width: 640px;">
    <div class="hero-eyebrow">Let's Plan Something</div>
    <h1 style="font-size: clamp(2rem, 4vw, 3rem);">Request a Quote</h1>
    <p style="opacity:0.8; margin-bottom: var(--space-4);">Tell us a little about your event and we'll get back to you with menu and presentation ideas.</p>

    <form method="POST">
      <div class="field-row">
        <div class="field">
          <label for="name">Your name</label>
          <input type="text" id="name" name="name" required value="{{ form.name or '' }}">
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required value="{{ form.email or '' }}">
        </div>
      </div>

      <div class="field-row">
        <div class="field">
          <label for="phone">Phone</label>
          <input type="tel" id="phone" name="phone" value="{{ form.phone or '' }}">
        </div>
        <div class="field">
          <label for="event_date">Event date</label>
          <input type="date" id="event_date" name="event_date">
        </div>
      </div>

      <div class="field-row">
        <div class="field">
          <label for="event_type">Event type</label>
          <select id="event_type" name="event_type">
            <option value="">Select one</option>
            {% for t in event_types %}
            <option value="{{ t }}">{{ t }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="field">
          <label for="guests">Estimated guests</label>
          <input type="number" id="guests" name="guests" min="1">
        </div>
      </div>

      <div class="field">
        <label for="message">Tell us about your event</label>
        <textarea id="message" name="message" placeholder="Vision, venue, any must-haves...">{{ form.message or '' }}</textarea>
      </div>

      <button type="submit" class="btn btn-primary">Send Inquiry</button>
    </form>
  </div>
</section>

{% endblock %}
