{% extends "admin/base.html" %}
{% block title %}{{ 'Edit' if client else 'New' }} Client — Admin{% endblock %}
{% block content %}

<div class="admin-header">
  <div>
    <div class="mono">{{ 'Edit' if client else 'Create' }}</div>
    <h2 class="mt-0">{{ 'Edit Client' if client else 'New Client' }}</h2>
  </div>
</div>

<form method="POST" class="panel" style="max-width: 560px;">
  <div class="field">
    <label for="name">Full name</label>
    <input type="text" id="name" name="name" required value="{{ client.name if client else '' }}">
  </div>
  <div class="field-row">
    <div class="field">
      <label for="phone">Phone</label>
      <input type="tel" id="phone" name="phone" value="{{ client.phone if client else '' }}">
    </div>
    <div class="field">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" value="{{ client.email if client else '' }}">
    </div>
  </div>
  <div class="field">
    <label for="notes">Notes</label>
    <textarea id="notes" name="notes">{{ client.notes if client else '' }}</textarea>
  </div>
  <button type="submit" class="btn btn-primary">{{ 'Save Changes' if client else 'Add Client' }}</button>
  <a href="{{ url_for('admin_clients_list') }}" class="btn btn-outline">Cancel</a>
</form>

{% endblock %}
